name: Fetch Whisper Model

on:
  push:
    paths:
      - '.github/workflows/fetch-whisper-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download multilingual small q5_1 model
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://github.com/w3xgroup/taskurio-models/releases/download/whisper-models-v1/ggml-small-q5_1.bin' \
            -o ggml-small-q5_1.bin
          echo 'ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  ggml-small-q5_1.bin' | sha256sum -c -
          ls -lh ggml-small-q5_1.bin

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5_1
          path: ggml-small-q5_1.bin
          retention-days: 1
          compression-level: 0
